<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>
</head>

<body class="min-h-screen bg-base-200">

    <main class="flex min-h-screen flex-col items-center gap-8 px-4">

        <form id="weatherForm" class="flex w-full max-w-xl gap-2 p-10">
            <input id="cityInput" type="text" placeholder="Enter city"
                class="input input-amber input-md w-full text-2xl font-bold">

            <button class="btn bg-amber-500 btn-md text-white rounded-sm" type="submit">
                Get Weather
            </button>
        </form>

        <div id="card" class="card w-full max-w-xl bg-white shadow-xl border" style="display: none;">
            <div class="card-body items-center text-center">
                <h1 class="cityDisplay text-4xl font-bold">
                    Bitungol
                </h1>
                <p class="tempDisplay text-6xl font-bold">
                    29°C
                </p>
                <p class="text-lg">
                    ☀️ Sunny
                </p>
                <div class="divider"></div>
                <div class="grid w-full grid-cols-2 gap-4">
                    <div class="rounded-xl bg-base-200 p-4">
                        <p class="text-sm opacity-60">
                            Humidity
                        </p>
                        <p class="text-xl font-bold">
                            75%
                        </p>
                    </div>

                    <div class="rounded-xl bg-base-200 p-4">
                        <p class="text-sm opacity-60">
                            Condition
                        </p>
                        <p class="text-xl font-bold">
                            Sunny
                        </p>
                    </div>

                </div>

            </div>

        </div>

    </main>
    <script src="index.js"></script>
    <script type="module" src="/src/main.js"></script>

</body>

</html>
