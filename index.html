<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>
</head>

<body class="min-h-screen bg-base-200">

    <main class="flex min-h-screen flex-col items-center justify-center gap-8 px-4">

        <!-- Search -->
        <form class="flex w-full max-w-xl gap-3">

            <input type="text" placeholder="Enter city" class="input h-20 w-full text-2xl">

            <button class="btn btn-info btn-sm" type="submit">
                Get Weather
            </button>

        </form>


        <!-- Weather Card -->
        <div class="card w-full max-w-xl bg-base-100 shadow-xl">

            <div class="card-body items-center text-center">

                <!-- City -->
                <h1 class="cityDisplay text-4xl font-bold">
                    Bitungol
                </h1>

                <!-- Temperature -->
                <p class="tempDisplay text-6xl font-bold">
                    29°C
                </p>

                <!-- Weather -->
                <p class="text-lg">
                    ☀️ Sunny
                </p>

                <!-- Details -->
                <div class="divider"></div>

                <div class="grid w-full grid-cols-2 gap-4">

                    <div class="rounded-xl bg-base-200 p-4">
                        <p class="text-sm opacity-60">
                            Humidity
                        </p>
                        <p class="text-xl font-bold">
                            75%
                        </p>
                    </div>

                    <div class="rounded-xl bg-base-200 p-4">
                        <p class="text-sm opacity-60">
                            Condition
                        </p>
                        <p class="text-xl font-bold">
                            Sunny
                        </p>
                    </div>

                </div>

            </div>

        </div>

    </main>
    <script type="module" src="/src/main.js"></script>

</body>

</html>
